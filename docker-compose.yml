services:
  postgres:
    image: postgres:16-alpine
    container_name: digital-hub-db
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: digital_hub
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app_user -d digital_hub']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
